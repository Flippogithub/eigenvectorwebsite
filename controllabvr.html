<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control Theory VR Lab</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}
body{background:#0a0a1a;font-family:'Courier New',monospace;color:#c0cdd8;overflow:hidden}
#hud{position:fixed;top:0;left:0;width:100%;z-index:999;background:rgba(10,10,26,0.9);padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
#hud button{background:#1a2332;color:#5ba4cf;border:1px solid #5ba4cf;padding:4px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:11px}
#hud button:hover,#hud button.active{background:#5ba4cf;color:#0a0a1a}
#matrix-panel{position:fixed;top:44px;left:8px;width:220px;z-index:999;background:rgba(26,35,50,0.95);border:1px solid rgba(91,164,207,0.3);border-radius:6px;padding:10px;font-size:11px;max-height:50vh;overflow-y:auto}
#matrix-panel h3{color:#5ba4cf;font-size:12px;margin:0 0 6px}
.mr{display:flex;gap:4px;margin:3px 0;align-items:center}
.mr label{color:#8899aa;width:48px;font-size:9px;flex-shrink:0}
.mr input[type=range]{flex:1;height:3px;accent-color:#5ba4cf}
.mr .v{color:#f0b429;width:36px;text-align:right;font-size:10px;flex-shrink:0}
#eigen-display{position:fixed;top:44px;right:8px;width:190px;z-index:999;background:rgba(26,35,50,0.95);border:1px solid rgba(91,164,207,0.3);border-radius:6px;padding:10px;font-size:11px}
#eigen-display h3{color:#f0b429;font-size:12px;margin:0 0 6px}
.er{display:flex;justify-content:space-between;margin:2px 0}
.es{color:#6bbf8a}.eu{color:#e8634f}
#chat-panel{position:fixed;bottom:0;right:0;width:320px;max-height:45vh;z-index:999;background:rgba(15,23,32,0.97);border-left:1px solid rgba(91,164,207,0.2);display:flex;flex-direction:column;font-size:12px}
#chat-header{padding:6px 10px;background:rgba(26,35,50,0.9);color:#f0b429;font-weight:700;font-size:11px}
#chat-messages{flex:1;overflow-y:auto;padding:6px 10px;min-height:100px}
.msg{margin:4px 0;padding:5px 7px;border-radius:5px;line-height:1.4;font-size:11px}
.msg.user{background:rgba(2,128,144,0.2);color:#5ba4cf;text-align:right}
.msg.claude{background:rgba(36,52,71,0.8);color:#e0e8f0}
.msg.system{background:rgba(240,180,41,0.1);color:#f0b429;font-size:10px}
#chat-input-row{display:flex;padding:5px;gap:4px;background:rgba(26,35,50,0.9)}
#chat-input{flex:1;background:#1a2332;border:1px solid #334;color:#e0e8f0;padding:5px 7px;border-radius:4px;font-family:inherit;font-size:11px;resize:none}
#chat-send{background:#028090;color:#fff;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:11px}
#worker-setup{padding:6px;background:rgba(240,180,41,0.1);border-radius:4px;margin:4px 8px}
#worker-setup input{width:100%;background:#1a2332;border:1px solid #334;color:#e0e8f0;padding:3px 5px;border-radius:3px;font-family:inherit;font-size:10px;margin-top:3px}
</style>
</head>
<body>
<div id="hud">
<span style="color:#f0b429;font-weight:700">VR Control Lab</span>
<button id="btn-thermostat" class="active" onclick="switchSystem('thermostat')">Thermostat</button>
<button id="btn-wedding" onclick="switchSystem('wedding')">Wedding</button>
<button id="btn-swerve" onclick="switchSystem('swerve')">Swerve</button>
<span style="color:#334">|</span>
<button onclick="toggleTrails()">Trails</button>
<button onclick="resetView()">Reset</button>
<span style="color:#8899aa;font-size:10px">L-stick move, R-stick turn</span>
</div>
<div id="matrix-panel"><h3>A Matrix - Drag to Change</h3><div id="matrix-sliders"></div></div>
<div id="eigen-display"><h3>Eigenvalues</h3><div id="eigen-list"></div><div id="stab" style="margin-top:6px;font-weight:700;font-size:12px"></div></div>
<div id="chat-panel">
<div id="chat-header">Claude - VR Tutor</div>
<div id="chat-messages">
<div id="worker-setup"><div style="color:#f0b429;font-size:10px">Paste Cloudflare Worker URL:</div>
<input id="worker-url" placeholder="https://your-worker.workers.dev" oninput="localStorage.setItem('wu',this.value)"></div>
<div class="msg system">Drag A matrix sliders to change physics. Watch eigenvalues and trajectories update live. Connect Claude via Cloudflare Worker to ask questions.</div>
</div>
<div id="chat-input-row"><textarea id="chat-input" rows="2" placeholder="Ask about the system..."></textarea><button id="chat-send" onclick="sendChat()">Send</button></div>
</div>

<a-scene vr-mode-ui="enabled:true" renderer="antialias:true" background="color:#0a0a1a">
<a-entity light="type:ambient;color:#334;intensity:0.5"></a-entity>
<a-entity light="type:directional;color:#abc;intensity:0.6" position="2 4 3"></a-entity>
<a-entity id="axes-group" position="0 1.5 -3"></a-entity>
<a-entity id="evec-group" position="0 1.5 -3"></a-entity>
<a-entity id="traj-group" position="0 1.5 -3"></a-entity>
<a-entity id="origin" position="0 1.5 -3">
<a-sphere radius="0.08" color="#f0b429" opacity="0.9" animation="property:scale;to:1.3 1.3 1.3;dur:1200;dir:alternate;loop:true"></a-sphere>
<a-text value="EQUILIBRIUM" position="0 -0.18 0" color="#f0b429" align="center" width="2" side="double" look-at="[camera]"></a-text>
</a-entity>
<a-entity id="board-group" position="0 1.5 -3"></a-entity>
<a-entity id="rig" movement-controls position="0 0 2">
<a-camera position="0 1.6 0" look-controls="pointerLockEnabled:false"></a-camera>
<a-entity laser-controls="hand:left"></a-entity>
<a-entity laser-controls="hand:right"></a-entity>
</a-entity>
</a-scene>

<script>
AFRAME.registerComponent('movement-controls',{
schema:{speed:{type:'number',default:0.15}},
init(){this.keys={};document.addEventListener('keydown',e=>this.keys[e.key.toLowerCase()]=true);document.addEventListener('keyup',e=>this.keys[e.key.toLowerCase()]=false)},
tick(t,dt){if(!dt)return;const s=this.data.speed,d=dt/1000;let mx=0,mz=0,ry=0;
if(this.keys.w||this.keys.arrowup)mz=-1;if(this.keys.s||this.keys.arrowdown)mz=1;
if(this.keys.a||this.keys.arrowleft)mx=-1;if(this.keys.d||this.keys.arrowright)mx=1;
const gs=navigator.getGamepads?navigator.getGamepads():[];
for(let i=0;i<gs.length;i++){const g=gs[i];if(!g||!g.axes)continue;
if(g.mapping==='xr-standard'){
if(g.hand==='left'&&g.axes.length>=4){if(Math.abs(g.axes[2])>.12)mx=g.axes[2];if(Math.abs(g.axes[3])>.12)mz=g.axes[3]}
if(g.hand==='right'&&g.axes.length>=4&&Math.abs(g.axes[2])>.12)ry=-g.axes[2]*2.5}
else if(g.axes.length>=4){if(Math.abs(g.axes[2])>.15)mx+=g.axes[2];if(Math.abs(g.axes[3])>.15)mz+=g.axes[3];if(Math.abs(g.axes[0])>.15)ry-=g.axes[0]*2}}
if(!mx&&!mz&&!ry)return;
if(ry){const r=this.el.getAttribute('rotation')||{x:0,y:0,z:0};this.el.setAttribute('rotation',{x:r.x,y:r.y+ry*d*60,z:r.z})}
const cam=this.el.querySelector('[camera]');if(!cam)return;
const wd=new THREE.Vector3();cam.object3D.getWorldDirection(wd);wd.y=0;wd.normalize();
const rt=new THREE.Vector3();rt.crossVectors(wd,new THREE.Vector3(0,1,0)).normalize();
const p=this.el.getAttribute('position');
p.x+=(rt.x*mx+wd.x*(-mz))*s*d*60;p.z+=(rt.z*mx+wd.z*(-mz))*s*d*60;
this.el.setAttribute('position',p)}});

const SYS={
thermostat:{name:"Thermostat",states:["Room Temp","Wall Temp"],A:[[-0.10,0.10],[0.05,-0.08]],sc:8,colors:["#e8634f","#5ba4cf"],desc:"2-state thermal system",pts:[[1,.2],[-.5,1],[1,1],[-1,-.5],[.8,-.8]]},
wedding:{name:"Wedding Reception",states:["Dance","BAC","Noise"],A:[[-0.2,1.5,0.3],[0,-0.1,0],[0.6,0.8,-0.3]],sc:3,colors:["#e8634f","#f0b429","#5ba4cf"],desc:"3-state party dynamics - has unstable mode",pts:[[1,.3,.5],[.2,1,.1],[.5,.5,1],[-.5,.8,.3],[1,1,1]]},
swerve:{name:"Swerve Drive",states:["Vx","Vy","Yaw"],A:[[-0.5,0,0.3],[0,-0.8,-2.0],[0,0.1,-0.4]],sc:3,colors:["#e8634f","#6bbf8a","#5ba4cf"],desc:"3-state robot dynamics",pts:[[1,.5,.2],[.3,1,-.3],[-.5,.5,1],[1,-1,.5]]}};
const DEFAULTS={thermostat:[[-0.10,0.10],[0.05,-0.08]],wedding:[[-0.2,1.5,0.3],[0,-0.1,0],[0.6,0.8,-0.3]],swerve:[[-0.5,0,0.3],[0,-0.8,-2.0],[0,0.1,-0.4]]};
let cur='thermostat',showT=true;

function e2(A){const a=A[0][0],b=A[0][1],c=A[1][0],d=A[1][1],tr=a+d,det=a*d-b*c,disc=tr*tr-4*det;
let vs;if(disc>=0)vs=[{r:(tr+Math.sqrt(disc))/2,i:0},{r:(tr-Math.sqrt(disc))/2,i:0}];
else vs=[{r:tr/2,i:Math.sqrt(-disc)/2},{r:tr/2,i:-Math.sqrt(-disc)/2}];
const vc=vs.map(ev=>{if(Math.abs(ev.i)>1e-10)return[1,0,0];const aa=A[0][0]-ev.r,bb=A[0][1];
if(Math.abs(bb)>1e-10){const l=Math.sqrt(1+(aa/bb)**2);return[1/l,(-aa/bb)/l,0]}
return Math.abs(aa)>1e-10?[0,1,0]:[1,0,0]});return{vs,vc}}

function e3(A){const tr=A[0][0]+A[1][1]+A[2][2],
p=A[0][0]*A[1][1]-A[0][1]*A[1][0]+A[0][0]*A[2][2]-A[0][2]*A[2][0]+A[1][1]*A[2][2]-A[1][2]*A[2][1],
det=A[0][0]*(A[1][1]*A[2][2]-A[1][2]*A[2][1])-A[0][1]*(A[1][0]*A[2][2]-A[1][2]*A[2][0])+A[0][2]*(A[1][0]*A[2][1]-A[1][1]*A[2][0]),
a2=-tr,a1=p,a0=-det,Q=(3*a1-a2*a2)/9,R=(9*a2*a1-27*a0-2*a2**3)/54,D=Q**3+R*R,vs=[];
if(D<=0){const th=Math.acos(Math.max(-1,Math.min(1,R/Math.sqrt(-(Q**3))))),sq=2*Math.sqrt(-Q);
vs.push({r:sq*Math.cos(th/3)-a2/3,i:0});vs.push({r:sq*Math.cos((th+2*Math.PI)/3)-a2/3,i:0});vs.push({r:sq*Math.cos((th+4*Math.PI)/3)-a2/3,i:0})}
else{const sd=Math.sqrt(D),S=Math.cbrt(R+sd),T=Math.cbrt(R-sd);vs.push({r:S+T-a2/3,i:0});const rp=-(S+T)/2-a2/3,ip=Math.sqrt(3)/2*(S-T);vs.push({r:rp,i:ip});vs.push({r:rp,i:-ip})}
const vc=vs.map(ev=>{if(Math.abs(ev.i)>1e-8)return[.577,.577,.577];const l=ev.r,
M=[[A[0][0]-l,A[0][1],A[0][2]],[A[1][0],A[1][1]-l,A[1][2]],[A[2][0],A[2][1],A[2][2]-l]],
r0=M[0],r1=M[1];let v=[r0[1]*r1[2]-r0[2]*r1[1],r0[2]*r1[0]-r0[0]*r1[2],r0[0]*r1[1]-r0[1]*r1[0]],
ln=Math.sqrt(v[0]**2+v[1]**2+v[2]**2);
if(ln<1e-10){const r2=M[2];v=[r0[1]*r2[2]-r0[2]*r2[1],r0[2]*r2[0]-r0[0]*r2[2],r0[0]*r2[1]-r0[1]*r2[0]];ln=Math.sqrt(v[0]**2+v[1]**2+v[2]**2)}
return ln<1e-10?[1,0,0]:v.map(x=>x/ln)});return{vs,vc}}

function sim(A,st,steps,dt,sc){const n=A.length;let s=[...st];const pts=[s.map(x=>x*sc)];
for(let i=0;i<steps;i++){const ns=Array(n).fill(0);for(let r=0;r<n;r++)for(let c=0;c<n;c++)ns[r]+=A[r][c]*s[c];
s=s.map((x,j)=>Math.max(-4,Math.min(4,x+ns[j]*dt)));pts.push(s.map(x=>x*sc))}return pts}

function clr(id){const e=document.getElementById(id);while(e.children.length)e.removeChild(e.children[0])}

function buildAxes(sys){clr('axes-group');const g=document.getElementById('axes-group'),al=3;
sys.states.forEach((nm,i)=>{const c=sys.colors[i],end=[0,0,0],en=[0,0,0];
if(i===0){end[0]=al;en[0]=-al}else if(i===1){end[1]=al;en[1]=-al}else{end[2]=al;en[2]=-al}
for(let o=-.005;o<=.005;o+=.005){const s=[0,0,0],e2=[...end],e3=[...en];
if(i!==1){s[1]=o;e2[1]+=o;e3[1]+=o}else{s[0]=o;e2[0]+=o;e3[0]+=o}
let l=document.createElement('a-entity');l.setAttribute('line',`start:${s.join(' ')};end:${e2.join(' ')};color:${c};opacity:0.7`);g.appendChild(l);
l=document.createElement('a-entity');l.setAttribute('line',`start:${s.join(' ')};end:${e3.join(' ')};color:${c};opacity:0.2`);g.appendChild(l)}
const lb=document.createElement('a-text'),lp=[0,0,0];
if(i===0)lp[0]=al+.4;else if(i===1)lp[1]=al+.4;else lp[2]=al+.4;
lb.setAttribute('value',`x${i+1}: ${nm}`);lb.setAttribute('position',lp.join(' '));
lb.setAttribute('color',c);lb.setAttribute('align','center');lb.setAttribute('width','4');
lb.setAttribute('side','double');lb.setAttribute('look-at','[camera]');g.appendChild(lb)})}

function buildEvec(sys){clr('evec-group');const g=document.getElementById('evec-group'),A=sys.A,n=A.length,
ed=n===2?e2(A):e3(A),cols=['#f0b429','#6bbf8a','#e8634f'];
ed.vs.forEach((ev,i)=>{if(Math.abs(ev.i)>.01)return;const v=ed.vc[i],al=2.2,c=cols[i%3],un=ev.r>.001,
ep=[v[0]*al,v[1]*al,n===2?0:v[2]*al];
const sh=document.createElement('a-entity');sh.setAttribute('line',`start:0 0 0;end:${ep.join(' ')};color:${c};opacity:0.9`);g.appendChild(sh);
const ns=document.createElement('a-entity');ns.setAttribute('line',`start:0 0 0;end:${ep.map(x=>-x).join(' ')};color:${c};opacity:0.3`);g.appendChild(ns);
const tp=document.createElement('a-cone');tp.setAttribute('position',ep.join(' '));
tp.setAttribute('radius-bottom','0.06');tp.setAttribute('radius-top','0');tp.setAttribute('height','0.15');tp.setAttribute('color',c);
if(un)tp.setAttribute('animation','property:scale;to:1.6 1.6 1.6;dur:400;dir:alternate;loop:true');g.appendChild(tp);
const lb=document.createElement('a-text');lb.setAttribute('position',`${ep[0]*1.15} ${ep[1]*1.15+.12} ${ep[2]*1.15}`);
lb.setAttribute('value',`L${i+1}=${ev.r.toFixed(3)}\n${un?'UNSTABLE':'stable'}`);
lb.setAttribute('color',un?'#e8634f':'#6bbf8a');lb.setAttribute('align','center');lb.setAttribute('width','3');
lb.setAttribute('side','double');lb.setAttribute('look-at','[camera]');g.appendChild(lb)});return ed}

function buildTraj(sys){clr('traj-group');if(!showT)return;const g=document.getElementById('traj-group'),n=sys.A.length,
tc=['#5ba4cf','#e8634f','#6bbf8a','#f0b429','#a78bfa'];
sys.pts.forEach((pt,pi)=>{const tr=sim(sys.A,pt,400,.05,sys.sc),c=tc[pi%5];
const sm=document.createElement('a-sphere'),sp=tr[0];
sm.setAttribute('position',n===2?`${sp[0]} ${sp[1]} 0`:`${sp[0]} ${sp[1]} ${sp[2]}`);
sm.setAttribute('radius','0.04');sm.setAttribute('color',c);g.appendChild(sm);
for(let i=3;i<tr.length;i+=3){const p=tr[i],pv=tr[i-3],op=Math.max(.08,.8-i/tr.length);
const ps=n===2?`${p[0]} ${p[1]} 0`:`${p[0]} ${p[1]} ${p[2]}`;
const pvs=n===2?`${pv[0]} ${pv[1]} 0`:`${pv[0]} ${pv[1]} ${pv[2]}`;
const ln=document.createElement('a-entity');
ln.setAttribute('line',`start:${pvs};end:${ps};color:${c};opacity:${op}`);g.appendChild(ln)}})}

function buildBoard(sys){clr('board-group');const g=document.getElementById('board-group'),
p=document.createElement('a-entity');p.setAttribute('position','-3.5 2.8 -2');
const bg=document.createElement('a-plane');bg.setAttribute('width','2.5');bg.setAttribute('height','1.2');
bg.setAttribute('color','#0f1720');bg.setAttribute('opacity','0.92');bg.setAttribute('side','double');bg.setAttribute('material','shader:flat');p.appendChild(bg);
const t=document.createElement('a-text');t.setAttribute('value',sys.name);t.setAttribute('position','0 0.4 0.01');
t.setAttribute('color','#f0b429');t.setAttribute('align','center');t.setAttribute('width','2.2');p.appendChild(t);
const d=document.createElement('a-text');d.setAttribute('value',sys.desc+'\n\nDrag sliders in panel to change\nA matrix. Watch eigenvalues shift.');
d.setAttribute('position','0 -0.05 0.01');d.setAttribute('color','#c0cdd8');d.setAttribute('align','center');d.setAttribute('width','1.8');p.appendChild(d);
p.setAttribute('look-at','[camera]');g.appendChild(p)}

function buildSliders(sys){const c=document.getElementById('matrix-sliders');c.innerHTML='';const n=sys.A.length;
for(let r=0;r<n;r++)for(let cl=0;cl<n;cl++){const row=document.createElement('div');row.className='mr';
const lb=document.createElement('label');lb.textContent=`A(${r+1},${cl+1})`;
const sl=document.createElement('input');sl.type='range';sl.min='-3';sl.max='3';sl.step='0.05';sl.value=sys.A[r][cl];
const vl=document.createElement('span');vl.className='v';vl.textContent=sys.A[r][cl].toFixed(2);
const v=sys.A[r][cl];vl.style.color=v>.01?'#e8634f':v<-.01?'#6bbf8a':'#8899aa';
sl.addEventListener('input',()=>{const val=parseFloat(sl.value);sys.A[r][cl]=val;vl.textContent=val.toFixed(2);
vl.style.color=val>.01?'#e8634f':val<-.01?'#6bbf8a':'#8899aa';updateScene(sys)});
row.appendChild(lb);row.appendChild(sl);row.appendChild(vl);c.appendChild(row)}}

function updateEigen(ed){const el=document.getElementById('eigen-list');el.innerHTML='';
ed.vs.forEach((ev,i)=>{const st=ev.r<-.001,s=Math.abs(ev.i)>.01?`${ev.r.toFixed(3)}+${ev.i.toFixed(3)}j`:ev.r.toFixed(3);
const row=document.createElement('div');row.className='er';
row.innerHTML=`<span>L${i+1}=${s}</span><span class="${st?'es':'eu'}">${st?'stable':'UNSTABLE'}</span>`;el.appendChild(row)});
const b=document.getElementById('stab'),ok=ed.vs.every(v=>v.r<-.001);
b.textContent=ok?'SYSTEM STABLE':'SYSTEM UNSTABLE';b.style.color=ok?'#6bbf8a':'#e8634f'}

function updateScene(sys){const ed=buildEvec(sys);buildTraj(sys);updateEigen(ed)}

function switchSystem(name){cur=name;const sys=SYS[name];
document.querySelectorAll('#hud button').forEach(b=>b.classList.remove('active'));
const btn=document.getElementById('btn-'+name);if(btn)btn.classList.add('active');
buildAxes(sys);const ed=buildEvec(sys);buildTraj(sys);buildBoard(sys);buildSliders(sys);updateEigen(ed)}

function toggleTrails(){showT=!showT;if(showT)buildTraj(SYS[cur]);else clr('traj-group')}
function resetView(){SYS[cur].A=DEFAULTS[cur].map(r=>[...r]);switchSystem(cur)}

function addMsg(t,c){const m=document.getElementById('chat-messages'),d=document.createElement('div');
d.className='msg '+c;d.textContent=t;m.appendChild(d);m.scrollTop=m.scrollHeight}

function getCtx(){const sys=SYS[cur],n=sys.A.length,ed=n===2?e2(sys.A):e3(sys.A);
return`System:${sys.name}\nStates:${sys.states.join(',')}\nA:${JSON.stringify(sys.A)}\nEigenvalues:${ed.vs.map((v,i)=>'L'+(i+1)+'='+v.r.toFixed(3)).join(',')}\nStable:${ed.vs.every(v=>v.r<-.001)}`}

function processCmd(text){const m=text.match(/<scene_cmd>([\s\S]*?)<\/scene_cmd>/);
if(!m)return text;const clean=text.replace(/<scene_cmd>[\s\S]*?<\/scene_cmd>/g,'').trim();
try{const cmd=JSON.parse(m[1]);
if(cmd.action==='update_A'&&cmd.A){const sn=cmd.system||cur;if(SYS[sn]){SYS[sn].A=cmd.A;if(sn===cur)switchSystem(cur);addMsg('Scene updated: '+(cmd.explanation||'A matrix changed'),'system')}}
else if(cmd.action==='set_system')switchSystem(cmd.system);
}catch(e){console.error(e)}return clean}

async function sendChat(){const inp=document.getElementById('chat-input'),msg=inp.value.trim();if(!msg)return;
inp.value='';addMsg(msg,'user');
const url=(document.getElementById('worker-url').value||'').trim()||localStorage.getItem('wu')||'';
if(!url){addMsg('Enter your Cloudflare Worker URL first.','system');return}
addMsg('Thinking...','system');
try{const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({message:msg,system_context:getCtx()})});const data=await resp.json();
const msgs=document.getElementById('chat-messages'),last=msgs.lastElementChild;
if(last&&last.textContent==='Thinking...')msgs.removeChild(last);
if(data.content&&data.content[0]){let t=processCmd(data.content[0].text);if(t)addMsg(t,'claude')}
else addMsg('No response.','system')}
catch(e){const msgs=document.getElementById('chat-messages'),last=msgs.lastElementChild;
if(last&&last.textContent==='Thinking...')msgs.removeChild(last);addMsg('Error: '+e.message,'system')}}

document.addEventListener('DOMContentLoaded',()=>{
document.getElementById('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}});
const saved=localStorage.getItem('wu');if(saved)document.getElementById('worker-url').value=saved;
const scene=document.querySelector('a-scene');
const init=()=>switchSystem('thermostat');
if(scene.hasLoaded)init();else scene.addEventListener('loaded',init)});
</script>
</body>
